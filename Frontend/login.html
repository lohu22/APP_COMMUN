<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion - APP</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #2c3e50;
    }
    .container {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 25px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1.8px solid #ccc;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #2980b9;
      outline: none;
    }
    button {
      width: 100%;
      padding: 15px;
      background-color: #2980b9;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #1c5d8f;
    }
    .signup-link {
      margin-top: 20px;
      font-size: 0.9rem;
    }
    .signup-link a {
      color: #2980b9;
      text-decoration: none;
      font-weight: 700;
    }
    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Connexion</h2>
    <form id="loginForm" action="#" method="POST">
      <input type="email" name="email" placeholder="Adresse e-mail" required />
      <input type="password" name="password" placeholder="Mot de passe" required />
      <button type="submit">Se connecter</button>
    </form>
    <p class="signup-link">Pas encore inscrit ? <a href="inscription.html">S'inscrire ici</a></p>
  </div>
</body>
</html>
