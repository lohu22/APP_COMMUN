<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestion Capteurs - APP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      font-weight: 700;
      font-size: 2.8rem;
      margin-bottom: 40px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .capteur-container {
      background: white;
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .sensor-value {
      font-weight: 800;
      font-size: 2rem;
      color: #2980b9;
      user-select: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      width: 100%;
    }

    button {
      flex: 1 1 120px;
      padding: 16px 0;
      border: none;
      border-radius: 18px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(116,235,213,0.6);
      color: white;
      transition: background 0.35s ease, transform 0.2s ease;
      user-select: none;
    }

    #refreshTemp {
      background: #ACB6E5;
      box-shadow: 0 5px 15px rgba(172,182,229,0.6);
      color: #2c3e50;
    }

    #refreshTemp:hover {
      background: #8b9bdc;
      box-shadow: 0 7px 20px rgba(139,155,220,0.8);
    }

    #turnOn {
      background: #74ebd5;
      box-shadow: 0 5px 15px rgba(116,235,213,0.6);
      color: #2c3e50;
    }

    #turnOn:hover {
      background: #67d9c8;
      box-shadow: 0 7px 20px rgba(103,217,200,0.8);
      color: white;
    }

    #turnOff {
      background: #f67280;
      box-shadow: 0 5px 15px rgba(246,114,128,0.6);
      color: white;
    }

    #turnOff:hover {
      background: #e55a69;
      box-shadow: 0 7px 20px rgba(229,90,105,0.8);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .capteur-container {
        padding: 30px 25px;
      }
      h2 {
        font-size: 2rem;
      }
      button {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <h2>Gestion des Capteurs & Actionneurs</h2>

  <section class="capteur-container">
    <p id="tempValue" class="sensor-value">Température : -- °C</p>
    <p id="humidityValue" class="sensor-value">Humidité : -- %</p>

    <div class="buttons">
      <button id="refreshSensors" type="button">Rafraîchir Capteurs</button>
      <button id="turnOn" type="button">Allumer</button>
      <button id="turnOff" type="button">Éteindre</button>
    </div>
  </section>
  
  <script>
    const tempValue = document.getElementById('tempValue');
    const humidityValue = document.getElementById('humidityValue');
    const refreshBtn = document.getElementById('refreshSensors');
    const turnOnBtn = document.getElementById('turnOn');
    const turnOffBtn = document.getElementById('turnOff');

    refreshBtn.addEventListener('click', () => {
      // Simuler récupération température et humidité
      const temp = (20 + Math.random() * 10).toFixed(1);
      const humidity = (40 + Math.random() * 30).toFixed(1);

      tempValue.textContent = `Température : ${temp} °C`;
      humidityValue.textContent = `Humidité : ${humidity} %`;
    });

    turnOnBtn.addEventListener('click', () => {
      alert('Actionneur allumé');
    });

    turnOffBtn.addEventListener('click', () => {
      alert('Actionneur éteint');
    });
  </script>
</body>
</html>
