<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShowPilot - Accueil</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0a0a23;
      --color-accent: #5ce1e6;
      --color-bg-light: #f9f9fb;
      --color-card: #ffffff;
      --color-text: #222;
      --font-main: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--color-bg-light);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: var(--color-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo img {
      height: 150px;
      width: auto;
      vertical-align: middle;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--color-accent);
    }

    .hero {
      background: linear-gradient(135deg, #2a2a72, #009ffd);
      color: white;
      padding: 8rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.25rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .presentation {
      max-width: 900px;
      margin: 90px auto 4rem;
      padding: 2rem;
      background-color: var(--color-card);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .presentation h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    footer {
      background-color: var(--color-primary);
      color: white;
      text-align: center;
      padding: 1.5rem;
      margin-top: auto;
    }

    footer a {
      color: var(--color-accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        gap: 1rem;
      }
      .presentation {
        margin: 80px 1rem 2rem;
      }
    }

    .navbar,
    .hero,
    footer {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="header"></div>
  <main>
    <section class="presentation">
      <h2>Notre mission</h2>
      <p>
        ShowPilot vous aide à offrir une expérience optimale à vos spectateurs en contrôlant
        intelligemment <strong>l'éclairage</strong> et la <strong>température ambiante</strong>.
      </p>
      <p>
        Toutes les données des capteurs sont analysées et disponibles en temps réel pour une gestion fluide et réactive.
      </p>
    </section>
  </main>
  <div id="footer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch("/APP_COMMUN/Frontend/header.php")
        .then(response => response.text())
        .then(data => {
          document.getElementById("header").innerHTML = data;
        })
        .catch(error => {
          console.error('Error loading header:', error);
        });

      fetch("/APP_COMMUN/Frontend/footer.html")
        .then(response => response.text())
        .then(data => {
          document.getElementById("footer").innerHTML = data;
        })
        .catch(error => {
          console.error('Error loading footer:', error);
        });
    });
  </script>
</body>
</html>
